# ==============================================================================
# Hostinger Cloud Startup - Production Nginx Reverse Proxy Configuration
# Optimized for Next.js 15, WhatsApp Webhooks, and AI Chat Streaming
# ==============================================================================

# Rate limiting zone for public APIs (60 requests per minute per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
# Dedicated higher throughput rate limit zone for Meta Webhooks (300 requests per minute)
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=300r/m;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certificates (managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression for Next.js assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Max upload size for WhatsApp media assets (64MB)
    client_max_body_size 64M;

    # 1. Next.js Static Chunks Cache
    location /_next/static/ {
        alias /var/www/whatsapp-saas/.next/static/;
        expires 365d;
        access_log off;
    }

    # 2. Public Static Assets
    location /static/ {
        alias /var/www/whatsapp-saas/public/;
        expires 30d;
        access_log off;
    }

    # 3. Meta WhatsApp Webhook Endpoint (High Throughput, No Buffering)
    location ~ ^/api/webhook(s)?/ {
        limit_req zone=webhook_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # 4. AI Chat Streaming Endpoint (Server-Sent Events)
    location /api/ai/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # 5. General Application Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
